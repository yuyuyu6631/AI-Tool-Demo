# Include this file from the public server block.
# The Web container is built with NEXT_PUBLIC_BASE_PATH=/xingdp, so the
# /xingdp prefix must be preserved when proxying to Next.js.

location = /xingdp {
    return 301 $scheme://$http_host/xingdp/;
}

location ^~ /xingdp/api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /xingdp;
}

location ^~ /xingdp/ {
    proxy_pass http://127.0.0.1:3000/xingdp/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /xingdp;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
