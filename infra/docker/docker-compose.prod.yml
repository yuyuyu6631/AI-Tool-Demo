services:
  mysql:
    image: mysql:8.4
    container_name: xdp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xingdianping}
      MYSQL_USER: ${MYSQL_USER:-xingdianping}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../infra/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - xdp-net

  redis:
    image: redis:7.4-alpine
    container_name: xdp-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - xdp-net

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: xdp-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-}
    volumes:
      - meili_data:/meili_data
    networks:
      - xdp-net

  api:
    image: ${API_IMAGE:-xingdianping-api:latest}
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: xdp-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-xingdianping}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-xingdianping}
      REDIS_URL: redis://redis:6379/0
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-meilisearch}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
      MEILISEARCH_INDEX: ${MEILISEARCH_INDEX:-tools}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-http://host.docker.internal:9997/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_OPENAI_BASE_URL: ${EMBEDDING_OPENAI_BASE_URL:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-https?://.*}
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@xingdianping.local}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - mysql
      - redis
      - meilisearch
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - xdp-net

  web:
    image: ${WEB_IMAGE:-xingdianping-web:latest}
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/xingdp}
        NEXT_PUBLIC_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_PUBLIC_BASE_PATH:-/xingdp}
        NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/xingdp}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://api:8000}
    container_name: xdp-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - xdp-net

networks:
  xdp-net:
    name: xdp-net

volumes:
  mysql_data:
  redis_data:
  meili_data:
